<!doctype html>
<html lang="hu" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="Heti étrend, bevásárlólista és közeli bolti árak. Nem hivatalos alkalmazás." />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
		<meta name="referrer" content="no-referrer" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<title>Heti kosár</title>
		<!-- The stored theme choice, applied before the first paint (no flash of the other theme), with the
		     browser's bars (the theme-color metas above); the app (src/lib/theme.svelte.ts) takes over from here.
		     Only a version-1 document counts, as in src/lib/storage.ts. Allowed by its sha256 hash, which
		     svelte.config.js computes from this file. -->
		<script>
			try {
				var stored = localStorage.getItem('hetikosar.state');
				var doc = stored && JSON.parse(stored);
				var theme = doc && doc.version === 1 && doc.theme;
				if (theme === 'light' || theme === 'dark') {
					document.documentElement.dataset.theme = theme;
					var metas = document.querySelectorAll('meta[name="theme-color"]');
					for (var i = 0; i < metas.length; i++) metas[i].content = theme === 'dark' ? '#000000' : '#ffffff';
				}
			} catch (error) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="app-root">%sveltekit.body%</div>
		<noscript>
			<p lang="hu">A Heti kosár működéséhez JavaScript szükséges.</p>
			<p lang="en">Heti kosár needs JavaScript to run.</p>
		</noscript>
	</body>
</html>
