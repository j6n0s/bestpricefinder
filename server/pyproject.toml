[project]
name = "bpf"
version = "0.1.0"
description = "bestpricefinder: weekly meal plans priced from public GVH Árfigyelő data (server, ingest, migrations)"
requires-python = ">=3.14"
# Runtime dependencies are pinned exactly; bump them deliberately (and re-run pip-audit).
dependencies = [
    "fastapi==0.143.0",
    "starlette==1.7.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "psycopg[binary,pool]==3.3.6",
    "psycopg-pool==3.3.3",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
]

[project.scripts]
bpf-migrate = "bpf.migrate:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bpf"]

[tool.uv]
# Never let uv pick a pre-release interpreter or package implicitly.
prerelease = "disallow"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "db: needs a PostgreSQL >= 16 cluster (a throwaway one is created by tests/pgcluster.py; skipped if no binaries are found)",
]

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["bpf", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
]

[tool.ruff.lint.per-file-ignores]
# Tests: plain asserts, subprocess calls to the deploy scripts, and throwaway credentials are expected.
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]
